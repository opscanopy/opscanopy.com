# Dependency update automation.
#
# Actions are SHA-pinned (see .github/workflows/*), which is the right security
# posture but means nothing tells you a pin is stale — Dependabot is the other
# half of that trade. It bumps the SHA and updates the trailing `# vN` comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Dev tooling churns constantly and cannot affect the shipped site, so
      # batch it into one reviewable PR instead of a weekly drip.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Exact-pinned deliberately: the version string encodes the jq binary
      # version the UI reads off the loaded module, and the WASM payload is
      # ~907KB, so a bump is a considered change with a size and behaviour
      # review — not something to merge on a bot's schedule. See CLAUDE.md.
      - dependency-name: jq-wasm

      # typescript majors are pinned back deliberately. @astrojs/check caps its
      # peer range at `^5.0.0 || ^6.0.0` — still true at its latest (0.9.10) — so
      # a TS 7 bump makes `npm ci` fail peer resolution outright. Dependabot
      # merged exactly that on 2026-08-03 and it broke Deploy and SEO report for
      # over two weeks; the failure is invisible locally, because an existing
      # node_modules keeps working. Minor/patch are fine; lift this only once
      # @astrojs/check declares TS 7 support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
