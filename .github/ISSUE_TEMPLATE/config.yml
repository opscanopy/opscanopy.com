# A blank issue is almost always one of the three templates, filed without the
# details that make it actionable. Questions belong in Discussions.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/opscanopy/opscanopy.com/discussions
    about: Ask how something works, or talk through an idea before building it.
  - name: Security issue
    url: https://github.com/opscanopy/opscanopy.com/security/policy
    about: Please report vulnerabilities privately, not as a public issue.
