name: Translation fix
description: Wrong, awkward or missing wording in German, Spanish, French or Brazilian Portuguese.
labels: ['translation']
body:
  - type: markdown
    attributes:
      value: |
        These pages are hand-translated, so they do drift. Corrections are very
        welcome, and they make a good first pull request.

        Note that **playground UI strings are English in every locale on
        purpose** — the tool chrome stays in one language while the page copy
        around it is translated. A report that the tool's own buttons are in
        English is expected behaviour, not a bug.
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - Deutsch (de)
        - Español (es)
        - Français (fr)
        - Português do Brasil (pt-br)
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://opscanopy.com/de/subnet-calculator/
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
      render: text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
      description: >
        If the page uses a particular register (for example formal *Sie* in
        German), please keep it consistent with the rest of that page.
      render: text
    validations:
      required: true
