name: Tool request
description: Suggest a tool that should exist here.
labels: ['tool request']
body:
  - type: markdown
    attributes:
      value: |
        The bar is not "is it useful" — it is "can it be exactly right, with no
        server". There is no backend here and there never will be, so anything
        needing a live network call to a third party (a TLS handshake against a
        host, a port scan, fetching someone else's URL) cannot be built as-is.
  - type: input
    id: tool
    attributes:
      label: What should it do
      placeholder: Validate a Kubernetes manifest against a specific cluster version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: When do you reach for this
      description: The situation you are in when you need it. Concrete beats general.
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: What you use today
      description: The CLI, site or script this would replace. This is the best signal there is.
      placeholder: kubeconform -strict -kubernetes-version 1.31
  - type: dropdown
    id: offline
    attributes:
      label: Can it work with no server?
      description: >
        Everything runs in the visitor's browser. Answer "not sure" freely —
        working that out is part of triage.
      options:
        - 'Yes — it is pure computation on pasted input'
        - 'Yes, with a schema or dataset bundled into the page'
        - 'It needs a live network call to a third party'
        - 'Not sure'
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: What decides the right answer
      description: >
        A spec, RFC, source implementation or published test vectors. Tools here
        are tested against those rather than against intuition, so a pointer
        makes this much easier to build.
