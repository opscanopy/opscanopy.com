name: Bug report
description: A tool gave a wrong answer, or something on the site is broken.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Every tool runs entirely in your browser, so the
        exact input and your browser version are usually enough to reproduce it.

        **Please do not paste real secrets** (tokens, private keys, production
        hostnames). A redacted input that still reproduces the bug is better for
        both of us.
  - type: input
    id: tool
    attributes:
      label: Which tool
      description: The page URL, or the tool name.
      placeholder: https://opscanopy.com/subnet-calculator/
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Exactly what you gave it, so it can be pasted straight in.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got
      description: >
        If there is a specification, RFC or CLI that settles it (`amtool`,
        `promtool`, `jq`, `ipcalc`…), say what that says — it usually becomes the
        test case.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser console. Optional.
      render: text
