# CodeQL static analysis.
#
# The whole site is client-side TypeScript that processes pasted user input and
# injects results as HTML strings, so the class of bug worth catching
# automatically is exactly what CodeQL's js/ts queries are good at: injection
# sinks, unsafe deserialization, and ReDoS.
#
# Action refs are SHA-pinned like every other workflow here; the trailing
# comment records the tag each SHA came from.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query still finds an unchanged repo.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required for CodeQL to upload its SARIF results.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
