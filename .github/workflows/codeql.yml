# CodeQL static analysis.
#
# The whole site is client-side TypeScript that processes pasted user input and
# injects results as HTML strings, so the class of bug worth catching
# automatically is exactly what CodeQL's js/ts queries are good at: injection
# sinks, unsafe deserialization, and ReDoS.
#
# Action refs are SHA-pinned like every other workflow here; the trailing
# comment records the tag each SHA came from.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query still finds an unchanged repo.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required for CodeQL to upload its SARIF results.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:javascript-typescript
