name: Publish container

# Build the self-hosting image and push it to GHCR.
#
# Self-hosting is the one distribution channel this project already had the
# machinery for — Dockerfile, compose file and an nginx config that carries the
# production CSP — but with no published image, "self-host it" meant "clone the
# repo and build it yourself", which almost nobody does.
#
# Runs on a version tag, plus manually. Deliberately NOT on every push to main:
# the tag is the thing people pin to, and a :latest that moves on every commit
# is worse than no :latest at all.
#
# No secrets needed — GITHUB_TOKEN can push to this repo's own package.
# The package starts out private: make it public once in the repo's Packages
# settings, or `docker pull` will ask strangers for credentials.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (in addition to the commit SHA). Leave blank for edge.'
        type: string
        default: 'edge'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs gen-tool-meta.mjs and gen-lastmod.mjs, which derive
          # dates from commit history — a shallow clone makes every page look
          # the same age.
          fetch-depth: 0

      # arm64 matters here: a good share of self-hosters are on a Pi or an
      # Apple-silicon machine, and emulated startup is the difference between
      # "works" and "why is this so slow".
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=OpsCanopy
            org.opencontainers.image.description=Free, private, browser-based tools for platform and DevOps engineers. No server, no account.
            org.opencontainers.image.url=https://opscanopy.com
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The build context has no .git; see the ARG in the Dockerfile.
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is a static site behind nginx, so "it serves the homepage and
      # a tool page" is the whole contract. Catches a broken build before anyone
      # pulls the tag.
      #
      # Run it with the SAME hardening the README and compose file document, not
      # a bare `docker run`. A plain run passes even when the documented command
      # crash-loops: a tmpfs mounts root-owned 0755 and masks the image's
      # `chown nginx`, which is exactly how `docker compose up -d` came to be
      # broken while nothing noticed. If the flags here and in the docs ever
      # drift apart again, this step stops being evidence.
      - name: Smoke test the published image
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name oc-smoke -p 8080:8080 \
            --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101 \
            --tmpfs /var/run:uid=101,gid=101 \
            --security-opt no-new-privileges:true \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          # If nginx died on boot the loop above just times out, which reads as
          # a confusing curl failure — surface the container's own log instead.
          docker ps --filter name=oc-smoke --filter status=running | grep -q oc-smoke \
            || { echo '::error::container is not running'; docker logs oc-smoke; exit 1; }
          curl -fsS -o /dev/null -w 'home   %{http_code}\n' http://localhost:8080/
          curl -fsS -o /dev/null -w 'tool   %{http_code}\n' http://localhost:8080/subnet-calculator/
          curl -fsS -o /dev/null -w 'locale %{http_code}\n' http://localhost:8080/de/
          # Not `curl | grep -q`: grep -q exits on the first match and closes the
          # pipe, curl then dies with a write error (exit 23), and pipefail turns
          # a fully working container into a red step. That is exactly how the
          # first run of this workflow failed with three 200s already printed.
          curl -fsS -o /tmp/oc-home.html http://localhost:8080/
          grep -q 'OpsCanopy' /tmp/oc-home.html
          # The service worker's cache names are keyed on BUILD_ID. If the
          # build-arg did not reach gen-sw.mjs this reads 'dev', every image
          # version shares one cache, and self-hosters serve stale pages after
          # an upgrade — so a 'dev' image must not pass.
          curl -fsS -o /tmp/oc-sw.js http://localhost:8080/sw.js
          grep -q "BUILD_ID = '${GITHUB_SHA::7}'" /tmp/oc-sw.js \
            || { echo "::error::sw.js BUILD_ID is not ${GITHUB_SHA::7}:"; grep -o "BUILD_ID = '[^']*'" /tmp/oc-sw.js; exit 1; }
          echo "sw     BUILD_ID ${GITHUB_SHA::7}"
          docker rm -f oc-smoke
