name: Syndicate

# Keeps dev.to syndication honest.
#
# Two jobs in one script (scripts/devto-sync.mjs):
#   1. Audit — every dev.to post that duplicates an opscanopy article must set
#      canonical_url back to the original. dev.to massively out-ranks a young
#      domain, so an uncanonicalised repost competes with the original and wins.
#   2. Repair — with --apply, PUT the correct canonical on anything that drifted.
#
# It deliberately does NOT canonicalise dev.to originals (posts with no local
# equivalent). Pointing canonical at a merely related page is wrong and gains
# nothing; those are listed in the script's OVERRIDES map as null.
#
# Required secret: DEVTO_API_KEY (dev.to -> Settings -> Extensions -> API Keys)

on:
  schedule:
    # Weekly drift check ONLY. This job never publishes — it repairs canonicals
    # on articles that already exist.
    - cron: '0 7 * * 1'
    #
    # There is deliberately NO publishing cron.
    #
    # An earlier version dripped 2 articles every Tue/Thu unattended. That is
    # removed: on 2026-07-27 seven articles went out in a single day against an
    # account that had twelve — a 58% jump, which is precisely the velocity
    # pattern platforms flag as spam. An unattended schedule makes that kind of
    # mistake automatic and invisible.
    #
    # Publishing is now manual only: run this workflow from the Actions tab with
    # `publish` ticked, or locally with `npm run syndicate -- --publish`. See
    # marketing/distribution/cadence.md for the agreed limits.
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'scripts/devto-sync.mjs'
      - 'scripts/syndicate.mjs'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write corrected canonical URLs (otherwise audit only)'
        type: boolean
        default: true
      publish:
        description: 'Publish queued articles. Leave OFF to only preview the queue.'
        type: boolean
        default: false
      limit:
        description: 'Max pieces per run. Keep at 2; 3+ risks looking like a dump.'
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  canonicals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Scheduled and push runs repair automatically; a manual run can opt out
      # by unticking `apply` to preview first.
      - name: Sync dev.to canonicals
        env:
          # The repo secret is named DEVTO; the script reads DEVTO_API_KEY.
          # Accept either so renaming the secret later does not break this.
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY || secrets.DEVTO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
            node scripts/devto-sync.mjs
          else
            node scripts/devto-sync.mjs --apply
          fi

  publish:
    # Manual only. Never on a schedule, never on push. Somebody has to tick
    # "publish" in the Actions tab, which is the point — see the note above.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Dry run first, always, and print it. If the publish step then does
      # something unexpected, the log above it shows exactly what was intended.
      - name: Preview the queue
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY || secrets.DEVTO }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/syndicate.mjs --limit ${{ inputs.limit || '2' }}

      - name: Publish
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY || secrets.DEVTO }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/syndicate.mjs --limit ${{ inputs.limit || '2' }} --publish

      # A canonical that failed to set is the one error worth catching straight
      # away, while the article is minutes old rather than a week.
      - name: Verify canonicals immediately
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY || secrets.DEVTO }}
        run: node scripts/devto-sync.mjs --apply
