name: Deploy

# Build, verify and publish opscanopy.com, then tell search engines what changed.
#
# Deploys were previously run by hand (`npm run deploy` from a laptop), which is
# why nothing downstream of a deploy could be automated. This is the pipeline the
# rest of the SEO automation hangs off.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template, scoped to this account
#   CLOUDFLARE_ACCOUNT_ID
# Optional:
#   BING_API_KEY           Bing Webmaster Tools -> Settings -> API access
#                          (bing-submit.mjs skips cleanly when absent)

on:
  push:
    branches: [main]
    # Docs-only edits do not change the built site.
    #
    # NOT '**/*.md'. That pattern matched src/content/blog/**/*.md and
    # src/content/guides/**/*.md — the site's actual content — so publishing a post
    # with no new image silently did not deploy. It went unnoticed because posts
    # have always shipped alongside a hero SVG, which is not markdown and triggered
    # the run anyway. '*.md' does not cross a directory separator, so it covers
    # README.md and CLAUDE.md at the root and nothing else.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'marketing/**'
      - 'reports/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      resubmit_all:
        description: 'Re-submit every sitemap URL to IndexNow, not just changed ones'
        type: boolean
        default: false

# Never let two deploys race to publish different builds.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gen-tool-meta.mjs and gen-lastmod.mjs derive dates from commit
          # history — a shallow clone would make every page look the same age.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test

      # Types are checked here and nowhere else in the pipeline: vite strips them
      # without checking, so a green `npm run build` says nothing about type
      # correctness. A return-shape mismatch in the GHA expression tester reached
      # production precisely because this step did not exist. The 128 pre-existing
      # errors that blocked it were cleared on 2026-08-27; keep it at zero.
      - name: Type check
        run: npm run check

      # Production dependencies only, high severity and above. Scoped that way
      # deliberately: a gate that fires on a dev-only moderate advisory becomes
      # a gate everyone learns to skip, and the site ships no dev code.
      #
      # This was temporarily narrowed to criticals-only on 2026-08-22, because the
      # outstanding astro advisory could not be cleared without a 6 -> 7 major. That
      # upgrade landed on 2026-08-27 and the tree is back to 0 advisories, so the
      # gate is strict again — which was always the intent, per docs/astro-7-upgrade.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Restore the IndexNow snapshot so the submit step can diff against the
      # previous deploy instead of re-announcing all 445 URLs every time.
      - name: Restore IndexNow snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      # Runs prebuild (tool-meta + lastmod) and postbuild (Pagefind, the
      # trailing-slash guard, CodeMirror modulepreload hints, service worker).
      # Never replace this with a bare `astro build` — /search breaks without
      # the Pagefind index.
      - name: Build
        run: npm run build

      - name: Guard against placeholder content
        run: node scripts/check-no-placeholder.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Submission runs only after a successful deploy — announcing URLs that
      # are not live yet gets them dropped.
      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs ${{ inputs.resubmit_all && '--all' || '' }}

      - name: Submit changed URLs to Bing
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/bing-submit.mjs

      - name: Save IndexNow snapshot
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}

      - name: Verify crawler reachability
        run: node scripts/check-crawlers.mjs
