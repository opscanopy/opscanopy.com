name: Deploy

# Build, verify and publish opscanopy.com, then tell search engines what changed.
#
# Deploys were previously run by hand (`npm run deploy` from a laptop), which is
# why nothing downstream of a deploy could be automated. This is the pipeline the
# rest of the SEO automation hangs off.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template, scoped to this account
#   CLOUDFLARE_ACCOUNT_ID
# Optional:
#   BING_API_KEY           Bing Webmaster Tools -> Settings -> API access
#                          (bing-submit.mjs skips cleanly when absent)

on:
  push:
    branches: [main]
    # Docs-only edits do not change the built site.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'marketing/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      resubmit_all:
        description: 'Re-submit every sitemap URL to IndexNow, not just changed ones'
        type: boolean
        default: false

# Never let two deploys race to publish different builds.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gen-tool-meta.mjs and gen-lastmod.mjs derive dates from commit
          # history — a shallow clone would make every page look the same age.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test

      # Production dependencies only. Criticals BLOCK; highs are reported but do
      # not block, which is a deliberate narrowing of the previous high-blocking
      # gate (2026-08-22).
      #
      # The reasoning: this site ships no server code and no untrusted build
      # input. Every high advisory outstanding at the time of the change was
      # build-time or dev-server-only and unreachable by a visitor — astro
      # (spread-prop XSS, prerendered-error SSRF), esbuild (dev server file read
      # on Windows), nanoid, postcss, svgo, sharp/libvips. Clearing the astro one
      # requires 6 -> 7.2.4, a major upgrade being tracked as its own piece of
      # work rather than smuggled in to turn CI green.
      #
      # This is the same principle as the original scoping note: a gate that
      # blocks on something nobody can act on is a gate people learn to skip.
      # Revisit when the astro major lands — the intent is to put highs back to
      # blocking, not to leave this permanently loose.
      - name: Audit production dependencies (criticals block)
        run: npm audit --omit=dev --audit-level=critical

      # Visibility without a veto: this step is expected to be red while the
      # advisories above are open, and must never gate the deploy.
      - name: Report high-severity advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Restore the IndexNow snapshot so the submit step can diff against the
      # previous deploy instead of re-announcing all 445 URLs every time.
      - name: Restore IndexNow snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      # Runs prebuild (tool-meta + lastmod) and postbuild (Pagefind, the
      # trailing-slash guard, CodeMirror modulepreload hints, service worker).
      # Never replace this with a bare `astro build` — /search breaks without
      # the Pagefind index.
      - name: Build
        run: npm run build

      - name: Guard against placeholder content
        run: node scripts/check-no-placeholder.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Submission runs only after a successful deploy — announcing URLs that
      # are not live yet gets them dropped.
      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs ${{ inputs.resubmit_all && '--all' || '' }}

      - name: Submit changed URLs to Bing
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/bing-submit.mjs

      - name: Save IndexNow snapshot
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}

      - name: Verify crawler reachability
        run: node scripts/check-crawlers.mjs
