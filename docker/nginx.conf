# nginx config for the self-host image (see ../Dockerfile).
#
# Astro builds with the default `directory` format: every route is a directory
# containing index.html, and every internal href ends in a slash (enforced at
# build time by scripts/check-trailing-slash.mjs). So the only routing rule that
# matters is "serve the directory index, else 404".

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Astro emits 404.html; serve it with a real 404 status rather than a 200,
  # which would make every typo look like a valid page to a crawler.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Security + cache headers, generated from _headers by
  # scripts/headers-to-nginx.mjs so this container keeps production's CSP.
  include /etc/nginx/opscanopy-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Bare path -> directory index. `$uri/` is what resolves /jwt-decoder to
  # /jwt-decoder/index.html; nginx issues its own 301 to add the slash.
  location / {
    try_files $uri $uri/ =404;
  }

  # Not part of a self-hosted deployment: /_redirects and /_headers are
  # Cloudflare control files (already deleted from the image), and the IndexNow
  # key only means anything for the public site.
  location = /a3f8c1d24b9e6705e2c8f4a17d093b6e.txt {
    return 404;
  }
}
