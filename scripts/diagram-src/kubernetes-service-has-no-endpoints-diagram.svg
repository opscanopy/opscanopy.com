<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" role="img" aria-label="The Service's spec.selector is compared against each pod's labels in the same namespace; matching pods with an IP are written into an EndpointSlice, and each endpoint carries a ready condition that decides whether it receives traffic">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-end"><path d="M0 0 L10 5 L0 10 z" fill="#33652c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-end"><path d="M0 0 L10 5 L0 10 z" fill="#8a8373"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#ffffff" stroke="#e6e1d6" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="54" font-size="30" font-weight="700" fill="#141310">How a Service finds its endpoints</text>
    <text x="40" y="108" font-size="17" font-weight="700" letter-spacing="2" fill="#6b6458">1 · SERVICE SELECTOR</text>
    <text x="410" y="108" font-size="17" font-weight="700" letter-spacing="2" fill="#6b6458">2 · PODS IN NAMESPACE shop</text>
    <text x="810" y="108" font-size="17" font-weight="700" letter-spacing="2" fill="#6b6458">3 · ENDPOINTSLICE</text>
  </g>
  <rect x="40" y="200" width="270" height="190" rx="12" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <text x="175" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#3a352c">Service</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#141310">
    <text x="175" y="268" text-anchor="middle" font-size="22" font-weight="600">checkout</text>
    <line x1="64" y1="288" x2="286" y2="288" stroke="#cfc9bb" stroke-width="2"/>
    <text x="64" y="318" font-size="18" fill="#6b6458">spec.selector</text>
    <text x="64" y="346" font-size="19">app=checkout</text>
    <text x="64" y="372" font-size="19">tier=backend</text>
  </g>
  <g stroke="#8a8373" stroke-width="3" stroke-dasharray="8 7" fill="none">
    <line x1="312" y1="280" x2="404" y2="186" marker-end="url(#ahg)"/>
    <line x1="312" y1="295" x2="404" y2="323" marker-end="url(#ahg)"/>
    <line x1="312" y1="310" x2="404" y2="460" marker-end="url(#ahg)"/>
  </g>
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6b6458"><tspan x="40" y="424">compared: every selector</tspan><tspan x="40" y="446">pair must be on the pod</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="410" y="128" width="320" height="110" rx="12" fill="#e2eeda" stroke="#4a8c3f" stroke-width="2"/>
    <text x="430" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#141310">pod A</text>
    <text x="710" y="160" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#33652c">✓ matches</text>
    <text x="430" y="190" fill="#141310">app=checkout</text>
    <text x="430" y="216" fill="#141310">tier=backend</text>
    <rect x="410" y="268" width="320" height="110" rx="12" fill="#fbecea" stroke="#b3261e" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="430" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#141310">pod B</text>
    <text x="710" y="300" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#b3261e">✗ no match</text>
    <text x="430" y="330" fill="#141310">app=checkout</text>
    <text x="430" y="356" fill="#b3261e" font-weight="600">tier=frontend</text>
    <text x="710" y="356" text-anchor="end" fill="#b3261e">≠ backend</text>
    <rect x="410" y="408" width="320" height="110" rx="12" fill="#e2eeda" stroke="#4a8c3f" stroke-width="2"/>
    <text x="430" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#141310">pod C</text>
    <text x="710" y="440" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#33652c">✓ matches</text>
    <text x="430" y="470" fill="#141310">app=checkout</text>
    <text x="430" y="496" fill="#141310">tier=backend</text>
  </g>
  <rect x="810" y="128" width="350" height="390" rx="12" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <g stroke="#33652c" stroke-width="3" fill="none">
    <line x1="732" y1="183" x2="826" y2="236" marker-end="url(#ah)"/>
    <line x1="732" y1="463" x2="826" y2="378" marker-end="url(#ah)"/>
  </g>
  <text x="830" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6b6458">service-name=checkout</text>
  <rect x="830" y="186" width="310" height="104" rx="10" fill="#e2eeda" stroke="#4a8c3f" stroke-width="2"/>
  <text x="850" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#141310">pod A's IP</text>
  <text x="850" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#33652c">ready: true</text>
  <text x="850" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">→ receives traffic</text>
  <rect x="830" y="326" width="310" height="104" rx="10" fill="#ffffff" stroke="#8a8373" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="850" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#141310">pod C's IP</text>
  <text x="850" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#3a352c">ready: false</text>
  <text x="850" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">→ listed, gets no traffic</text>
  <text x="830" y="470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#6b6458">pod B is not listed:</text>
  <text x="830" y="494" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#6b6458">its labels did not match</text>
  <text x="40" y="568" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">Only pods in the Service's own namespace are compared. Pods with no IP yet are left out of the slice.</text>
</svg>
