<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="A decision flow showing how branches, tags and paths filters decide whether a GitHub Actions workflow triggers on a push">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M0 0 L10 5 L0 10 z" fill="#4a8c3f"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M0 0 L10 5 L0 10 z" fill="#c2321f"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M0 0 L10 5 L0 10 z" fill="#9c968a"/></marker>
  </defs>
  <rect width="1200" height="720" rx="20" fill="#ffffff" stroke="#e6e1d6" stroke-width="2"/>

  <text x="48" y="62" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#141310">How branches, tags &amp; paths decide if a push triggers a workflow</text>

  <!-- Event node -->
  <rect x="48" y="100" width="280" height="92" rx="12" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <text x="68" y="134" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" fill="#3a352c">push event arrives</text>
  <text x="68" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141310">on.push filters</text>

  <!-- Three decision diamonds, 240 wide x 200 tall, centred at x = 260 / 560 / 860
       on the y = 320 baseline, with a 60px gap between neighbours for the
       "yes" / "AND" labels (2026-10-03: the previous 380-wide diamonds overlapped
       each other by 100px and the labels sat inside the next diamond). -->
  <!-- DIAMOND 1: branches / tags ref match -->
  <path d="M120 220 L240 320 L120 420 L0 320 Z" transform="translate(140,0)" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <text x="260" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" fill="#3a352c">Ref matches</text>
  <text x="260" y="335" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141310">branches</text>
  <text x="260" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="17" fill="#6b675f">or tags glob?</text>

  <!-- arrow event -> diamond1 (ends just above the diamond's upper-left edge) -->
  <line x1="188" y1="192" x2="236" y2="236" stroke="#4a8c3f" stroke-width="3" marker-end="url(#ah)"/>

  <!-- DIAMOND 2: paths match -->
  <path d="M120 220 L240 320 L120 420 L0 320 Z" transform="translate(440,0)" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <text x="560" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" fill="#3a352c">A changed file</text>
  <text x="560" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="17" fill="#6b675f">matches</text>
  <text x="560" y="352" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141310">paths</text>

  <!-- arrow diamond1 -> diamond2 (YES, ANDed) -->
  <line x1="380" y1="320" x2="436" y2="320" stroke="#4a8c3f" stroke-width="3" marker-end="url(#ah)"/>
  <text x="410" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#33652c">yes</text>
  <text x="410" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="14" fill="#6b675f">AND</text>

  <!-- DIAMOND 3: paths-ignore -->
  <path d="M120 220 L240 320 L120 420 L0 320 Z" transform="translate(740,0)" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <text x="860" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" fill="#3a352c">Some file is</text>
  <text x="860" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="17" fill="#6b675f">outside</text>
  <text x="860" y="352" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141310">paths-ignore</text>

  <!-- arrow diamond2 -> diamond3 (YES) -->
  <line x1="680" y1="320" x2="736" y2="320" stroke="#4a8c3f" stroke-width="3" marker-end="url(#ah)"/>
  <text x="710" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#33652c">yes</text>

  <!-- WORKFLOW RUNS node -->
  <rect x="1030" y="276" width="130" height="88" rx="12" fill="#e2eeda" stroke="#4a8c3f" stroke-width="2"/>
  <text x="1095" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#33652c">workflow</text>
  <text x="1095" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#33652c">runs</text>

  <!-- arrow diamond3 -> runs (YES); the label sits in the gap, not on the node -->
  <line x1="980" y1="320" x2="1026" y2="320" stroke="#4a8c3f" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1003" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#33652c">yes</text>

  <!-- SKIPPED node (shared, bottom) — centred under diamond 2 -->
  <rect x="460" y="560" width="200" height="84" rx="12" fill="#f0ede6" stroke="#9c968a" stroke-width="2"/>
  <text x="560" y="595" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#524f48">skipped</text>
  <text x="560" y="623" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" fill="#6b675f">no run, no error</text>

  <!-- NO arrows down to skipped (land at x = 520 / 560 / 600); every label
       sits to the right of its own vertical, above the y = 488 bus -->
  <!-- diamond1 NO -->
  <path d="M260 420 L260 488 L520 488 L520 558" fill="none" stroke="#9c968a" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="274" y="447" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#6b675f">no</text>
  <text x="274" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b675f">feature* misses feature/login</text>

  <!-- diamond2 NO -->
  <path d="M560 420 L560 558" fill="none" stroke="#9c968a" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="574" y="447" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#6b675f">no</text>
  <text x="574" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b675f">only README.md changed</text>

  <!-- diamond3 NO (every file ignored) -->
  <path d="M860 420 L860 488 L600 488 L600 558" fill="none" stroke="#9c968a" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="874" y="447" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#6b675f">no</text>
  <text x="874" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b675f">every file matches docs/** , **.md</text>

  <!-- footnote -->
  <text x="48" y="690" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="16" fill="#6b675f">A missing filter means "match everything." When present, branches/tags and paths are ANDed — both must pass. Over 300 changed files: filtering gives up and the run proceeds.</text>
</svg>
