<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" role="img" aria-label="Anatomy of a -/+ plan line: the header names the resource address and the verb must be replaced, the -/+ action symbol means destroy then create, the changed attribute storage_encrypted goes from false to true, and the # forces replacement suffix names that attribute as the cause">
  <rect x="1" y="1" width="1198" height="578" rx="20" fill="#ffffff" stroke="#e6e1d6" stroke-width="2"/>
  <text x="40" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#141310">Anatomy of a -/+ plan line</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#3a352c">
    <text x="90" y="110"><tspan font-weight="700" fill="#a85a06">1</tspan><tspan font-weight="700" fill="#141310" dx="10">Resource address</tspan></text>
    <text x="90" y="136">which object is replaced</text>
    <text x="566" y="110"><tspan font-weight="700" fill="#a85a06">2</tspan><tspan font-weight="700" fill="#141310" dx="10">Header verb</tspan></text>
    <text x="566" y="136">must be replaced = an attribute forced it</text>

    <text x="40" y="486"><tspan font-weight="700" fill="#a85a06">3</tspan><tspan font-weight="700" fill="#141310" dx="10">Action symbol</tspan></text>
    <text x="40" y="512">-/+ destroy, then create</text>
    <text x="40" y="538">+/- create, then destroy</text>
    <text x="300" y="486"><tspan font-weight="700" fill="#a85a06">4</tspan><tspan font-weight="700" fill="#141310" dx="10">Changed attribute</tspan></text>
    <text x="300" y="512">old value -&gt; new value</text>
    <text x="640" y="486"><tspan font-weight="700" fill="#a85a06">5</tspan><tspan font-weight="700" fill="#141310" dx="10">"# forces replacement" suffix</tspan></text>
    <text x="640" y="512">names the attribute that caused it</text>
    <text x="640" y="538">never printed for taint, -replace or replace_triggered_by</text>
  </g>

  <rect x="40" y="180" width="1120" height="245" rx="12" fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#141310">
    <text x="64" y="250">#</text>
    <text x="90" y="250">module.data.aws_db_instance.primary</text>
    <text x="566" y="250" font-weight="700">must be replaced</text>
    <text x="64" y="300" font-weight="700">-/+</text>
    <text x="122" y="300">resource "aws_db_instance" "primary" {</text>
    <text x="90" y="350">~</text>
    <text x="116" y="350">storage_encrypted = false -&gt; true</text>
    <text x="566" y="350" font-weight="700">#&#160;forces replacement</text>
    <text x="90" y="400">}</text>
  </g>

  <g fill="none" stroke="#6b6457" stroke-width="2" stroke-linecap="round">
    <path d="M90 216 V208 H552 V216"/>
    <line x1="321" y1="146" x2="321" y2="208"/>
    <path d="M566 216 V208 H778 V216"/>
    <line x1="672" y1="146" x2="672" y2="208"/>
    <path d="M64 312 V320 H106 V312"/>
    <line x1="76" y1="320" x2="76" y2="462"/>
    <path d="M116 362 V370 H552 V362"/>
    <line x1="334" y1="370" x2="334" y2="462"/>
    <path d="M566 362 V370 H832 V362"/>
    <line x1="698" y1="370" x2="698" y2="462"/>
  </g>
</svg>
