<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" role="img" aria-label="Which trust store each client reads: curl and git with the OpenSSL backend read a PEM bundle file and --cacert or http.sslCAInfo replace it; Node and npm read a Mozilla CA list compiled into Node, NODE_EXTRA_CA_CERTS appends and npm cafile replaces; pip 24.2 and later on Python 3.10+ reads certifi plus the OS store and --cert adds a bundle; Schannel clients read the Windows certificate store">
  <rect x="1" y="1" width="1198" height="558" rx="20" fill="#ffffff" stroke="#e6e1d6" stroke-width="2"/>
  <text x="40" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#141310">Which trust store each client reads</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6b6457">
    <text x="40" y="104">CLIENT</text>
    <text x="400" y="104">DEFAULT TRUST STORE</text>
    <text x="820" y="104">OVERRIDE</text>
  </g>

  <g fill="#f7f5f0" stroke="#cfc9bb" stroke-width="2">
    <rect x="40" y="124" width="300" height="84" rx="12"/>
    <rect x="40" y="226" width="300" height="84" rx="12"/>
    <rect x="40" y="328" width="300" height="84" rx="12"/>
    <rect x="40" y="430" width="300" height="84" rx="12"/>
    <rect x="400" y="124" width="380" height="84" rx="12"/>
    <rect x="400" y="226" width="380" height="84" rx="12"/>
    <rect x="400" y="328" width="380" height="84" rx="12"/>
    <rect x="400" y="430" width="380" height="84" rx="12"/>
  </g>

  <g fill="none" stroke="#6b6457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M344 166 H392 M384 158 L392 166 L384 174"/>
    <path d="M344 268 H392 M384 260 L392 268 L384 276"/>
    <path d="M344 370 H392 M384 362 L392 370 L384 378"/>
    <path d="M344 472 H392 M384 464 L392 472 L384 480"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#141310">
    <text x="64" y="160">curl, git</text>
    <text x="64" y="262">node, npm</text>
    <text x="64" y="364">pip</text>
    <text x="64" y="466">curl.exe, git</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">
    <text x="64" y="188">OpenSSL backend</text>
    <text x="64" y="290">bundled CA list</text>
    <text x="64" y="392">24.2+ on Python 3.10+</text>
    <text x="64" y="494">Schannel backend</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#141310">
    <text x="424" y="160">PEM bundle file</text>
    <text x="424" y="262">Mozilla CA list</text>
    <text x="424" y="364">certifi + OS store</text>
    <text x="424" y="466">Windows certificate store</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">
    <text x="424" y="188">curl: set at build; git: shipped or OS</text>
    <text x="424" y="290">compiled into the Node binary</text>
    <text x="424" y="392">through truststore</text>
    <text x="424" y="494">Schannel can fetch missing intermediates</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#3a352c">
    <text x="820" y="160"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--cacert</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">http.sslCAInfo</tspan></text>
    <text x="820" y="188"><tspan font-weight="700" fill="#904d49">replace</tspan> the store</text>
    <text x="820" y="262"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NODE_EXTRA_CA_CERTS</tspan>: <tspan font-weight="700" fill="#33652c">appends</tspan></text>
    <text x="820" y="290">npm <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cafile</tspan>: <tspan font-weight="700" fill="#904d49">replaces</tspan></text>
    <text x="820" y="364"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--cert</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PIP_CERT</tspan></text>
    <text x="820" y="392"><tspan font-weight="700" fill="#33652c">adds</tspan> a bundle</text>
    <text x="820" y="466">managed by Windows</text>
    <text x="820" y="494">or Group Policy</text>
  </g>
</svg>
