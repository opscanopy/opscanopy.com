<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Test GitHub Actions locally — a workflow box with a checkmark verified before it reaches the runner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0503f"/><stop offset="1" stop-color="#a85a06"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#sheen)"/>
  <circle cx="980" cy="315" r="210" fill="#ffffff" fill-opacity="0.08"/>
  <text x="80" y="150" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#ffffff" fill-opacity="0.85">CI/CD</text>
  <text font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="#ffffff"><tspan x="80" y="300">Test GitHub Actions</tspan><tspan x="80" y="384">locally</tspan></text>
  <text x="80" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#ffffff" fill-opacity="0.72">opscanopy.com</text>
  <g transform="translate(980,315)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-140" y="-110" width="280" height="220" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    <rect x="-140" y="-110" width="280" height="220" rx="14"/>
    <line x1="-104" y1="-62" x2="60" y2="-62" stroke="#a85a06" stroke-opacity="0.85" stroke-width="9"/>
    <line x1="-104" y1="-30" x2="30" y2="-30" stroke="#a85a06" stroke-opacity="0.85" stroke-width="9"/>
    <circle cx="0" cy="46" r="52" fill="#a85a06" fill-opacity="0.92" stroke="none"/>
    <path d="M -22 46 L -6 64 L 26 24" stroke="#ffffff" stroke-width="11" fill="none"/>
  </g>
</svg>
