<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="GitHub Actions cron runs in UTC — a clock showing a schedule converted to local time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6ea5"/><stop offset="1" stop-color="#2f7d82"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#sheen)"/>
  <circle cx="980" cy="315" r="210" fill="#ffffff" fill-opacity="0.08"/>
  <text x="80" y="150" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#ffffff" fill-opacity="0.85">SCHEDULING</text>
  <text font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="#ffffff"><tspan x="80" y="300">GitHub Actions cron</tspan><tspan x="80" y="384">runs in UTC</tspan></text>
  <text x="80" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#ffffff" fill-opacity="0.72">opscanopy.com</text>
  <g transform="translate(980,315)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="150" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    <circle r="150"/>
    <line x1="0" y1="-118" x2="0" y2="-132" stroke-width="6"/>
    <line x1="0" y1="118" x2="0" y2="132" stroke-width="6"/>
    <line x1="-118" y1="0" x2="-132" y2="0" stroke-width="6"/>
    <line x1="118" y1="0" x2="132" y2="0" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-92" stroke="#2f7d82" stroke-opacity="0.95" stroke-width="10"/>
    <line x1="0" y1="0" x2="66" y2="46" stroke="#2f7d82" stroke-opacity="0.95" stroke-width="10"/>
    <circle r="9" fill="#2f7d82" stroke="none"/>
  </g>
</svg>
