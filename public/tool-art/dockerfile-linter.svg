<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the dockerfile linter tool">
  <!-- Dockerfile document (source) -->
  <rect x="34" y="34" width="136" height="132" rx="10" fill="#3b82b8" fill-opacity="0.12" stroke="#3b82b8" stroke-width="4" stroke-linejoin="round"/>
  <!-- folded corner -->
  <path d="M142 34 L170 62 L142 62 Z" fill="#3b82b8" fill-opacity="0.18" stroke="#3b82b8" stroke-width="3" stroke-linejoin="round"/>

  <!-- line-number gutter -->
  <circle cx="48" cy="62" r="2.2" fill="#b3ab9c"/>
  <circle cx="48" cy="84" r="2.2" fill="#b3ab9c"/>
  <circle cx="48" cy="106" r="2.2" fill="#b3ab9c"/>
  <circle cx="48" cy="128" r="2.2" fill="#b3ab9c"/>
  <circle cx="48" cy="150" r="2.2" fill="#b3ab9c"/>

  <!-- instruction lines: keyword bar + argument bar -->
  <line x1="58" y1="62" x2="80" y2="62" stroke="#3b82b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="62" x2="124" y2="62" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <line x1="58" y1="84" x2="76" y2="84" stroke="#3b82b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="84" y1="84" x2="140" y2="84" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>

  <line x1="58" y1="106" x2="82" y2="106" stroke="#3b82b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="106" x2="132" y2="106" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <line x1="58" y1="128" x2="74" y2="128" stroke="#3b82b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="128" x2="146" y2="128" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>

  <line x1="58" y1="150" x2="86" y2="150" stroke="#3b82b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="150" x2="128" y2="150" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- connector into the findings list -->
  <line x1="180" y1="100" x2="206" y2="100" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 93 L210 100 L200 107" stroke="#3b82b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- finding row 1 — error -->
  <rect x="220" y="44" width="150" height="34" rx="8" fill="#3b82b8" fill-opacity="0.10" stroke="#3b82b8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="240" cy="61" r="9" stroke="#b0503f" stroke-width="3"/>
  <path d="M236.5 57.5 L243.5 64.5 M243.5 57.5 L236.5 64.5" stroke="#b0503f" stroke-width="3" stroke-linecap="round"/>
  <line x1="258" y1="61" x2="342" y2="61" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>

  <!-- finding row 2 — warning -->
  <rect x="220" y="88" width="150" height="34" rx="8" fill="#3b82b8" fill-opacity="0.10" stroke="#3b82b8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M240 96 L249 112 H231 Z" stroke="#a85a06" stroke-width="3" stroke-linejoin="round"/>
  <path d="M240 102.5 v3" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>
  <line x1="258" y1="105" x2="352" y2="105" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>

  <!-- finding row 3 — resolved -->
  <rect x="220" y="132" width="150" height="34" rx="8" fill="#3b82b8" fill-opacity="0.16" stroke="#3b82b8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="240" cy="149" r="9" stroke="#3b82b8" stroke-width="3"/>
  <path d="M236 149 L239.5 152.5 L245 145.5" stroke="#3b82b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="258" y1="149" x2="326" y2="149" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- subtle highlight on the document -->
  <line x1="44" y1="46" x2="74" y2="46" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>
</svg>
