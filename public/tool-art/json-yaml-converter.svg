<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the json yaml converter tool">
  <!-- annotation badge (top centre): the honest loss report this tool adds -->
  <path d="M200 18 L213 41 L187 41 Z" fill="#a8721f" fill-opacity="0.16" stroke="#a8721f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M200 27 V32" stroke="#a8721f" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 36.5 v0.01" stroke="#a8721f" stroke-width="3" stroke-linecap="round"/>

  <!-- ── JSON card (left): braces + key/value rules ───────────────────────── -->
  <rect x="30" y="52" width="124" height="96" rx="10" fill="#a8721f" fill-opacity="0.12" stroke="#a8721f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- opening brace -->
  <path d="M58 66 q-10 0 -10 10 v10 q0 8 -8 8 q8 0 8 8 v10 q0 10 10 10" stroke="#a8721f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- key line (darker = the key), then two value lines -->
  <line x1="72" y1="78" x2="118" y2="78" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="100" x2="138" y2="100" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="122" x2="112" y2="122" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- ── Two-way conversion arrows (centre) ──────────────────────────────── -->
  <path d="M168 86 H232" stroke="#a8721f" stroke-width="4" stroke-linecap="round"/>
  <path d="M222 77 L232 86 L222 95" stroke="#a8721f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 114 H168" stroke="#a8721f" stroke-width="4" stroke-linecap="round"/>
  <path d="M178 105 L168 114 L178 123" stroke="#a8721f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── YAML card (right): indentation, colons, one sequence item ────────── -->
  <rect x="246" y="52" width="124" height="96" rx="10" fill="#a8721f" fill-opacity="0.08" stroke="#a8721f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- top-level key: colon dot + key rule -->
  <circle cx="264" cy="74" r="3" fill="#a8721f"/>
  <line x1="274" y1="74" x2="322" y2="74" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <!-- indentation guide down the nested block -->
  <path d="M266 86 V132" stroke="#b3ab9c" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <!-- nested key -->
  <circle cx="280" cy="96" r="3" fill="#a8721f"/>
  <line x1="290" y1="96" x2="350" y2="96" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <!-- sequence items: the "- " bullet plus its value -->
  <line x1="280" y1="118" x2="288" y2="118" stroke="#a8721f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="296" y1="118" x2="346" y2="118" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="136" x2="288" y2="136" stroke="#a8721f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="296" y1="136" x2="330" y2="136" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- dropped comment: a # rule fading out, the loss the badge above reports -->
  <line x1="60" y1="166" x2="96" y2="166" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
  <line x1="286" y1="166" x2="340" y2="166" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
</svg>
