<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the grafana dashboard validator tool">
  <!-- dashboard frame -->
  <rect x="28" y="30" width="186" height="140" rx="10" fill="#7a5aa0" fill-opacity="0.10" stroke="#7a5aa0" stroke-width="4" stroke-linejoin="round"/>
  <!-- title row + variable pickers -->
  <line x1="42" y1="46" x2="96" y2="46" stroke="#7a5aa0" stroke-width="4" stroke-linecap="round"/>
  <rect x="140" y="39" width="28" height="14" rx="4" fill="#7a5aa0" fill-opacity="0.18" stroke="#7a5aa0" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="174" y="39" width="28" height="14" rx="4" fill="none" stroke="#b0503f" stroke-width="2.5" stroke-dasharray="4 3" stroke-linejoin="round"/>

  <!-- panel 1: a healthy time series -->
  <rect x="42" y="62" width="76" height="44" rx="7" fill="#7a5aa0" fill-opacity="0.14" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 96 L62 84 L72 90 L84 74 L96 82 L110 70" stroke="#7a5aa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 2: bars -->
  <rect x="128" y="62" width="76" height="44" rx="7" fill="#7a5aa0" fill-opacity="0.14" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <line x1="140" y1="98" x2="140" y2="80" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="154" y1="98" x2="154" y2="72" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="168" y1="98" x2="168" y2="86" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="182" y1="98" x2="182" y2="76" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>

  <!-- panel 3: a panel with no type — an empty box -->
  <rect x="42" y="116" width="76" height="44" rx="7" fill="none" stroke="#b0503f" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <path d="M72 132 L88 148 M88 132 L72 148" stroke="#b0503f" stroke-width="3" stroke-linecap="round"/>

  <!-- panel 4: a legacy panel flagged for migration -->
  <rect x="128" y="116" width="76" height="44" rx="7" fill="#7a5aa0" fill-opacity="0.14" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M166 126 L177 146 H155 Z" stroke="#a85a06" stroke-width="3" stroke-linejoin="round"/>
  <path d="M166 134 v4" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>

  <!-- connector into the findings list -->
  <line x1="218" y1="100" x2="230" y2="100" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M226 93 L234 100 L226 107" stroke="#7a5aa0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- finding row 1 — error, with a JSON path chip -->
  <rect x="240" y="42" width="132" height="34" rx="8" fill="#7a5aa0" fill-opacity="0.10" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="258" cy="59" r="8" stroke="#b0503f" stroke-width="3"/>
  <path d="M255 56 L261 62 M261 56 L255 62" stroke="#b0503f" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="274" y="52" width="40" height="14" rx="4" fill="#7a5aa0" fill-opacity="0.20" stroke="none"/>
  <line x1="320" y1="59" x2="358" y2="59" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>

  <!-- finding row 2 — warning -->
  <rect x="240" y="86" width="132" height="34" rx="8" fill="#7a5aa0" fill-opacity="0.10" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M258 94 L266 110 H250 Z" stroke="#a85a06" stroke-width="3" stroke-linejoin="round"/>
  <path d="M258 100.5 v3" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>
  <rect x="274" y="96" width="34" height="14" rx="4" fill="#7a5aa0" fill-opacity="0.20" stroke="none"/>
  <line x1="314" y1="103" x2="360" y2="103" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>

  <!-- finding row 3 — checked and clear -->
  <rect x="240" y="130" width="132" height="34" rx="8" fill="#7a5aa0" fill-opacity="0.16" stroke="#7a5aa0" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="258" cy="147" r="8" stroke="#7a5aa0" stroke-width="3"/>
  <path d="M254.5 147 L257.5 150 L262 144.5" stroke="#7a5aa0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="274" y1="147" x2="340" y2="147" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- subtle highlight on the dashboard frame -->
  <line x1="38" y1="38" x2="66" y2="38" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>
</svg>
