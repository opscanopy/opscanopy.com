<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the AWS IAM policy generator tool">
  <!-- the policy document -->
  <rect x="48" y="32" width="168" height="136" rx="12" fill="#b0503f" fill-opacity="0.08" stroke="#8a8377" stroke-width="3" stroke-linejoin="round"/>
  <!-- JSON braces -->
  <path d="M74 50 q-10 0 -10 10 v20 q0 8 -8 8 q8 0 8 8 v20 q0 10 10 10" stroke="#b0503f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Effect / Action / Resource statement rows -->
  <path d="M86 62 H122" stroke="#b0503f" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 62 H186" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 88 H112" stroke="#b0503f" stroke-width="4" stroke-linecap="round"/>
  <path d="M122 88 H196" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 114 H130" stroke="#b0503f" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 114 H176" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 140 H150" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- connector to the guard -->
  <path d="M216 100 C238 100, 248 100, 262 100" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- least-privilege shield with a key -->
  <path d="M316 40 L360 56 V96 C360 126, 340 146, 316 158 C292 146, 272 126, 272 96 V56 Z" fill="#b0503f" fill-opacity="0.12" stroke="#b0503f" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="316" cy="88" r="12" stroke="#b0503f" stroke-width="4"/>
  <path d="M316 100 V128 M316 116 H326 M316 126 H324" stroke="#b0503f" stroke-width="4" stroke-linecap="round"/>
</svg>
