<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the kubernetes label selector tester tool">
  <!-- selector card (the clause list) -->
  <rect x="30" y="46" width="136" height="108" rx="10" fill="#5560a8" fill-opacity="0.12" stroke="#5560a8" stroke-width="4" stroke-linejoin="round"/>

  <!-- clause 1: key = value -->
  <line x1="44" y1="70" x2="70" y2="70" stroke="#5560a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M76 67h8 M76 73h8" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="70" x2="132" y2="70" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- clause 2: key != value (the slashed equals) -->
  <line x1="44" y1="100" x2="66" y2="100" stroke="#5560a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 97h8 M72 103h8 M81 92l-10 16" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="122" y2="100" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- clause 3: bare key (Exists) -->
  <line x1="44" y1="130" x2="74" y2="130" stroke="#5560a8" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="130" x2="98" y2="130" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4"/>

  <!-- connector into the verdict column -->
  <line x1="176" y1="100" x2="202" y2="100" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 93l10 7-10 7" stroke="#5560a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- verdict 1: pod hexagon, matches -->
  <path d="M236 30l20 11.5v23L236 76l-20-11.5v-23z" fill="#5560a8" fill-opacity="0.16" stroke="#5560a8" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M228 52l6 6 11-13" stroke="#5560a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="272" y1="47" x2="360" y2="47" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="59" x2="326" y2="59" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- verdict 2: pod hexagon, does not match -->
  <path d="M236 88l20 11.5v23L236 134l-20-11.5v-23z" fill="#b3ab9c" fill-opacity="0.14" stroke="#b3ab9c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M230 105l12 12M242 105l-12 12" stroke="#b0503f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="272" y1="105" x2="344" y2="105" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="117" x2="308" y2="117" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- verdict 3: pod hexagon with NO labels at all — matched by NotIn (amber) -->
  <path d="M236 146l20 11.5v23L236 192l-20-11.5v-23z" fill="#a85a06" fill-opacity="0.10" stroke="#a85a06" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <path d="M228 168l6 6 11-13" stroke="#a85a06" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="272" y1="163" x2="316" y2="163" stroke="#a85a06" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="272" y1="175" x2="296" y2="175" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- subtle highlight on the selector card -->
  <line x1="40" y1="58" x2="70" y2="58" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>
</svg>
