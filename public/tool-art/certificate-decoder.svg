<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the certificate decoder and chain checker tool">
  <!-- Three stacked certificates: leaf on top, intermediate, then the root.
       The root is drawn with a dashed edge because a client supplies it from its
       own trust store rather than the handshake. -->

  <!-- leaf certificate -->
  <rect x="40" y="22" width="228" height="42" rx="9" fill="#b0503f" fill-opacity="0.16" stroke="#b0503f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- subject name bar -->
  <rect x="54" y="31" width="96" height="10" rx="3" fill="#b0503f" fill-opacity="0.28" stroke="#b0503f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- decoded field lines -->
  <line x1="54" y1="52" x2="138" y2="52" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="52" x2="252" y2="52" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- intermediate certificate -->
  <rect x="40" y="78" width="228" height="42" rx="9" fill="#b0503f" fill-opacity="0.11" stroke="#b0503f" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="54" y="87" width="112" height="10" rx="3" fill="#b0503f" fill-opacity="0.22" stroke="#b0503f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="54" y1="108" x2="126" y2="108" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="136" y1="108" x2="240" y2="108" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- root certificate, dashed: it comes from the trust store, not the wire -->
  <rect x="40" y="134" width="228" height="42" rx="9" fill="#b0503f" fill-opacity="0.07" stroke="#b0503f" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9 6"/>
  <rect x="54" y="143" width="84" height="10" rx="3" fill="#b0503f" fill-opacity="0.16" stroke="#8a8377" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="54" y1="164" x2="118" y2="164" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="164" x2="218" y2="164" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- "signed by the one below" arrows, one per chain edge -->
  <g stroke="#8a8377" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 66 V76"/>
    <path d="M75 71 L80 76 L85 71"/>
    <path d="M80 122 V132"/>
    <path d="M75 127 L80 132 L85 127"/>
  </g>

  <!-- per-edge signature verdicts: a leaf-green tick on each verified link -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="71" r="9" fill="#4a8c3f" fill-opacity="0.16" stroke="#4a8c3f" stroke-width="2.5"/>
    <path d="M191.5 71.5 l3 3 l6 -7" stroke="#4a8c3f" stroke-width="2.5"/>
    <circle cx="196" cy="127" r="9" fill="#4a8c3f" fill-opacity="0.16" stroke="#4a8c3f" stroke-width="2.5"/>
    <path d="M191.5 127.5 l3 3 l6 -7" stroke="#4a8c3f" stroke-width="2.5"/>
  </g>

  <!-- bracket gathering all three certificates into one chain verdict -->
  <path d="M288 30 H304 V168 H288" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M304 99 H318" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- chain-verified badge -->
  <circle cx="344" cy="99" r="22" fill="#4a8c3f" fill-opacity="0.14" stroke="#4a8c3f" stroke-width="3.5"/>
  <path d="M333 100 l7 7 l14 -16" stroke="#4a8c3f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
