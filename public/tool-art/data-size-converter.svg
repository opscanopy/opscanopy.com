<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the data size converter tool">
  <!-- Storage drum (left) — the raw byte count -->
  <ellipse cx="81" cy="48" rx="45" ry="11" fill="#7a6e52" fill-opacity="0.16" stroke="#7a6e52" stroke-width="3.5"/>
  <path d="M36 48v80c0 6.1 20.1 11 45 11s45-4.9 45-11V48" stroke="#7a6e52" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- platter divisions -->
  <path d="M36 75c0 6.1 20.1 11 45 11s45-4.9 45-11" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <path d="M36 102c0 6.1 20.1 11 45 11s45-4.9 45-11" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- Two-way conversion arrows (center) -->
  <path d="M142 74H190" stroke="#a85a06" stroke-width="4" stroke-linecap="round"/>
  <path d="M182 66l8 8-8 8" stroke="#a85a06" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 104h-48" stroke="#a85a06" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 96l-8 8 8 8" stroke="#a85a06" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SI vs IEC columns (right) — same size, two conventions -->
  <path d="M206 140h158" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <!-- SI column (1000-based, shorter count of bigger-looking units) -->
  <rect x="216" y="92" width="54" height="48" rx="6" fill="#7a6e52" fill-opacity="0.14" stroke="#7a6e52" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- IEC column (1024-based) -->
  <rect x="292" y="66" width="54" height="74" rx="6" fill="#7a6e52" fill-opacity="0.30" stroke="#7a6e52" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- the divergence: SI height projected onto the IEC column -->
  <path d="M292 92h54" stroke="#a85a06" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <!-- gap bracket -->
  <path d="M356 66v26" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>
  <path d="M351 66h10M351 92h10" stroke="#a85a06" stroke-width="3" stroke-linecap="round"/>
  <!-- unit labels (abstract ticks) -->
  <line x1="228" y1="152" x2="258" y2="152" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <line x1="304" y1="152" x2="334" y2="152" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- Transfer track (bottom) — the same size, moving over a link -->
  <path d="M36 176h258" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 176h180" stroke="#7a6e52" stroke-width="4" stroke-linecap="round"/>
  <path d="M286 169l8 7-8 7" stroke="#b3ab9c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- elapsed clock -->
  <circle cx="336" cy="176" r="13" stroke="#a85a06" stroke-width="3"/>
  <path d="M336 168v8l6 4" stroke="#a85a06" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
