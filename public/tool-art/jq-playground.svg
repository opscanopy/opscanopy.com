<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the jq playground tool">
  <!-- ── The filter, written above the pipe: a jq program in brackets ────── -->
  <path d="M150 20 q-11 0 -11 9 v5 q0 6 -7 6 q7 0 7 6 v5 q0 9 11 9" stroke="#a2456b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 20 q11 0 11 9 v5 q0 6 7 6 q-7 0 -7 6 v5 q0 9 -11 9" stroke="#a2456b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the filter path itself: dot, pipe bar, dot — `.a | .b` -->
  <circle cx="166" cy="40" r="3.5" fill="#a2456b"/>
  <line x1="176" y1="40" x2="196" y2="40" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="204" y1="30" x2="204" y2="50" stroke="#a2456b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="214" cy="40" r="3.5" fill="#a2456b"/>
  <line x1="224" y1="40" x2="248" y2="40" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>

  <!-- ── stdin: the JSON document (left), braces plus key/value rules ────── -->
  <rect x="24" y="62" width="104" height="92" rx="10" fill="#a2456b" fill-opacity="0.10" stroke="#b3ab9c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M52 76 q-9 0 -9 9 v8 q0 7 -7 7 q7 0 7 7 v8 q0 9 9 9" stroke="#a2456b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="64" y1="86" x2="106" y2="86" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="114" y2="106" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="126" x2="98" y2="126" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- ── The funnel: many values in, one filter, a stream out ───────────── -->
  <path d="M148 74 H236 L204 112 V140 L180 128 V112 Z" fill="#a2456b" fill-opacity="0.14" stroke="#a2456b" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- input arrow into the funnel -->
  <path d="M136 96 H150" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>

  <!-- ── stdout: the stream, one card per output ─────────────────────────── -->
  <path d="M244 108 H268" stroke="#a2456b" stroke-width="4" stroke-linecap="round"/>
  <path d="M260 100 L268 108 L260 116" stroke="#a2456b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="278" y="58" width="96" height="26" rx="7" fill="#a2456b" fill-opacity="0.16" stroke="#a2456b" stroke-width="3" stroke-linejoin="round"/>
  <line x1="290" y1="71" x2="342" y2="71" stroke="#a2456b" stroke-width="4" stroke-linecap="round"/>

  <rect x="278" y="95" width="96" height="26" rx="7" fill="#a2456b" fill-opacity="0.16" stroke="#a2456b" stroke-width="3" stroke-linejoin="round"/>
  <line x1="290" y1="108" x2="330" y2="108" stroke="#a2456b" stroke-width="4" stroke-linecap="round"/>

  <rect x="278" y="132" width="96" height="26" rx="7" fill="#a2456b" fill-opacity="0.16" stroke="#a2456b" stroke-width="3" stroke-linejoin="round"/>
  <line x1="290" y1="145" x2="352" y2="145" stroke="#a2456b" stroke-width="4" stroke-linecap="round"/>

  <!-- ── The ground-truth mark: WASM runs here, in the tab ──────────────── -->
  <rect x="24" y="168" width="104" height="20" rx="6" fill="none" stroke="#b3ab9c" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="38" y1="178" x2="52" y2="178" stroke="#8a8377" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="60" y1="178" x2="114" y2="178" stroke="#b3ab9c" stroke-width="3.5" stroke-linecap="round"/>
</svg>
