<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the LLM token counter tool">
  <!-- prompt text: plain lines of prose -->
  <path d="M40 46 H220" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 66 H186" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>

  <!-- the same text split into tokens of uneven width -->
  <rect x="36" y="96" width="44" height="26" rx="5" fill="#8f5c94" fill-opacity="0.16" stroke="#8f5c94" stroke-width="3"/>
  <rect x="86" y="96" width="26" height="26" rx="5" fill="#8f5c94" fill-opacity="0.08" stroke="#8a8377" stroke-width="3"/>
  <rect x="118" y="96" width="58" height="26" rx="5" fill="#8f5c94" fill-opacity="0.16" stroke="#8f5c94" stroke-width="3"/>
  <rect x="182" y="96" width="34" height="26" rx="5" fill="#8f5c94" fill-opacity="0.08" stroke="#8a8377" stroke-width="3"/>
  <rect x="36" y="130" width="30" height="26" rx="5" fill="#8f5c94" fill-opacity="0.08" stroke="#8a8377" stroke-width="3"/>
  <rect x="72" y="130" width="52" height="26" rx="5" fill="#8f5c94" fill-opacity="0.16" stroke="#8f5c94" stroke-width="3"/>
  <rect x="130" y="130" width="22" height="26" rx="5" fill="#8f5c94" fill-opacity="0.08" stroke="#8a8377" stroke-width="3"/>

  <!-- arrow from tokens to the count -->
  <path d="M236 116 H272" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 108 l8 8 l-8 8" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the count: a tally badge -->
  <rect x="288" y="80" width="76" height="72" rx="12" fill="#8f5c94" fill-opacity="0.12" stroke="#8f5c94" stroke-width="4" stroke-linejoin="round"/>
  <path d="M310 100 V132 M322 100 V132 M334 100 V132 M346 100 V132" stroke="#8f5c94" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M304 128 L352 104" stroke="#8a8377" stroke-width="3.5" stroke-linecap="round"/>
  <!-- context window limit rule -->
  <path d="M288 168 H364" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
  <path d="M288 162 V174 M364 162 V174" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>
</svg>
