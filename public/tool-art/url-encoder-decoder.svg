<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the URL encoder decoder and query string parser tool">
  <!-- URL bar (top) — split into scheme / host / path / query zones -->
  <rect x="36" y="30" width="328" height="42" rx="10" fill="#a8721f" fill-opacity="0.12" stroke="#a8721f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- query zone tinted: the part this tool pulls apart -->
  <path d="M286 30h68a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-68z" fill="#a8721f" fill-opacity="0.16"/>
  <!-- zone dividers -->
  <line x1="110" y1="34" x2="110" y2="68" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="34" x2="196" y2="68" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>
  <line x1="286" y1="34" x2="286" y2="68" stroke="#a8721f" stroke-width="3" stroke-linecap="round"/>
  <!-- text inside each zone -->
  <line x1="50" y1="51" x2="96" y2="51" stroke="#8a8377" stroke-width="4" stroke-linecap="round"/>
  <line x1="124" y1="51" x2="182" y2="51" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="51" x2="272" y2="51" stroke="#b3ab9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="51" x2="350" y2="51" stroke="#a8721f" stroke-width="4" stroke-linecap="round"/>

  <!-- Split arrow: the query zone opens into the parameter table below -->
  <path d="M325 78 L325 92" stroke="#a8721f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M316 84 L325 93 L334 84" stroke="#a8721f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Parameter table (bottom) — decoded key = value rows -->
  <rect x="36" y="100" width="328" height="70" rx="10" fill="#a8721f" fill-opacity="0.08" stroke="#a8721f" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- row 1: plain key = value -->
  <rect x="54" y="114" width="52" height="11" rx="3.5" fill="#8a8377" fill-opacity="0.28" stroke="#8a8377" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="116" y1="117" x2="126" y2="117" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="123" x2="126" y2="123" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="136" y="114" width="96" height="11" rx="3.5" fill="#4a8c3f" fill-opacity="0.16" stroke="#4a8c3f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- row 2: percent-escaped value (three %XX pairs, amber) -->
  <rect x="54" y="132" width="52" height="11" rx="3.5" fill="#8a8377" fill-opacity="0.28" stroke="#8a8377" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="116" y1="135" x2="126" y2="135" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="141" x2="126" y2="141" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="136" y="132" width="26" height="11" rx="3.5" fill="#a8721f" fill-opacity="0.2" stroke="#a8721f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="168" y="132" width="26" height="11" rx="3.5" fill="#a8721f" fill-opacity="0.2" stroke="#a8721f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="200" y="132" width="26" height="11" rx="3.5" fill="#a8721f" fill-opacity="0.2" stroke="#a8721f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- decoded twin of row 2, drawn as a leaf tick: encode ⇄ decode -->
  <path d="M238 137 L244 143 L254 131" stroke="#4a8c3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- row 3: repeated key — same key block twice, second badged -->
  <rect x="54" y="150" width="52" height="11" rx="3.5" fill="#8a8377" fill-opacity="0.28" stroke="#8a8377" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="116" y1="153" x2="126" y2="153" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="159" x2="126" y2="159" stroke="#b3ab9c" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="136" y="150" width="64" height="11" rx="3.5" fill="#4a8c3f" fill-opacity="0.16" stroke="#4a8c3f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="212" cy="155.5" r="4" fill="#a8721f"/>
  <circle cx="226" cy="155.5" r="4" fill="#a8721f" fill-opacity="0.45"/>
</svg>
