<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the Terraform plan summarizer tool">
  <!-- A plan transcript on the left, read down into four counted actions on the
       right. The palette is the IaC olive (#667a33) for structure, with the four
       semantic hues the stat band itself uses: leaf-green add, amber change,
       brick destroy, ochre replace. Neutrals are the warm greys shared by every
       other tool-art file so the tile reads in both themes. -->

  <!-- the pasted transcript -->
  <rect x="26" y="20" width="150" height="160" rx="9" fill="#667a33" fill-opacity="0.10" stroke="#667a33" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- header comment line: "# aws_db_instance.primary" -->
  <line x1="40" y1="38" x2="132" y2="38" stroke="#8a8377" stroke-width="3" stroke-linecap="round"/>

  <!-- symbol-prefixed resource lines, each with its own action glyph -->
  <!-- + create -->
  <g stroke="#4a8c3f" stroke-width="3" stroke-linecap="round">
    <path d="M40 56 H50"/>
    <path d="M45 51 V61"/>
  </g>
  <line x1="60" y1="56" x2="150" y2="56" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- ~ update -->
  <path d="M40 74 q5 -5 10 0 q5 5 10 0" stroke="#a85a06" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="70" y1="74" x2="140" y2="74" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- - destroy -->
  <path d="M40 92 H54" stroke="#b0503f" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="92" x2="152" y2="92" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- -/+ replace, and the amber "forces replacement" annotation beside it -->
  <g stroke="#b0670a" stroke-width="3" stroke-linecap="round">
    <path d="M40 110 H50"/>
    <path d="M56 116 L64 104"/>
    <path d="M70 110 H80"/>
    <path d="M75 105 V115"/>
  </g>
  <rect x="88" y="103" width="62" height="13" rx="4" fill="#a85a06" fill-opacity="0.20" stroke="#a85a06" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- the elided middle of a long plan -->
  <g fill="#b3ab9c">
    <circle cx="44" cy="132" r="2.6"/>
    <circle cx="54" cy="132" r="2.6"/>
    <circle cx="64" cy="132" r="2.6"/>
  </g>

  <!-- the "Plan:" summary line, the figure everything is reconciled against -->
  <rect x="40" y="148" width="122" height="16" rx="4" fill="#667a33" fill-opacity="0.22" stroke="#667a33" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- reading arrow from the transcript into the counted tiles -->
  <g stroke="#8a8377" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 100 H214"/>
    <path d="M206 92 L214 100 L206 108"/>
  </g>

  <!-- four disjoint count tiles: add, change, destroy, replace -->
  <rect x="228" y="20" width="70" height="74" rx="9" fill="#4a8c3f" fill-opacity="0.14" stroke="#4a8c3f" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#4a8c3f" stroke-width="3.5" stroke-linecap="round">
    <path d="M252 46 H274"/>
    <path d="M263 35 V57"/>
  </g>
  <line x1="244" y1="76" x2="282" y2="76" stroke="#4a8c3f" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>

  <rect x="308" y="20" width="70" height="74" rx="9" fill="#a85a06" fill-opacity="0.14" stroke="#a85a06" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M328 48 q7.5 -9 15 0 q7.5 9 15 0" stroke="#a85a06" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <line x1="324" y1="76" x2="362" y2="76" stroke="#a85a06" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>

  <rect x="228" y="106" width="70" height="74" rx="9" fill="#b0503f" fill-opacity="0.14" stroke="#b0503f" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M251 133 H275" stroke="#b0503f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="244" y1="162" x2="282" y2="162" stroke="#b0503f" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>

  <rect x="308" y="106" width="70" height="74" rx="9" fill="#b0670a" fill-opacity="0.14" stroke="#b0670a" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#b0670a" stroke-width="3.5" stroke-linecap="round">
    <path d="M331 128 H355"/>
    <path d="M343 117 V139"/>
    <path d="M331 146 H355"/>
  </g>
  <line x1="324" y1="162" x2="362" y2="162" stroke="#b0670a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
</svg>
