<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Illustration of the LLM VRAM calculator tool">
  <!-- GPU board -->
  <rect x="40" y="48" width="200" height="104" rx="12" fill="#8f5c94" fill-opacity="0.10" stroke="#8f5c94" stroke-width="4" stroke-linejoin="round"/>
  <!-- fan -->
  <circle cx="92" cy="100" r="30" fill="#8f5c94" fill-opacity="0.12" stroke="#8a8377" stroke-width="3"/>
  <path d="M92 100 q-4 -18 8 -24 M92 100 q18 -4 24 8 M92 100 q4 18 -8 24 M92 100 q-18 4 -24 -8" stroke="#8f5c94" stroke-width="3" stroke-linecap="round"/>
  <circle cx="92" cy="100" r="4" fill="#8f5c94"/>
  <!-- memory chips on the board -->
  <rect x="140" y="66" width="24" height="24" rx="4" stroke="#8f5c94" stroke-width="3"/>
  <rect x="176" y="66" width="24" height="24" rx="4" stroke="#8f5c94" stroke-width="3"/>
  <rect x="140" y="110" width="24" height="24" rx="4" stroke="#b3ab9c" stroke-width="3"/>
  <rect x="176" y="110" width="24" height="24" rx="4" stroke="#b3ab9c" stroke-width="3"/>
  <!-- PCIe edge connector -->
  <path d="M70 152 V164 M86 152 V164 M102 152 V164 M118 152 V164 M134 152 V164" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round"/>

  <!-- VRAM gauge: weights + KV cache stacking toward the limit -->
  <rect x="272" y="40" width="64" height="120" rx="8" stroke="#8a8377" stroke-width="3" stroke-linejoin="round"/>
  <rect x="280" y="104" width="48" height="48" rx="4" fill="#8f5c94" fill-opacity="0.35"/>
  <rect x="280" y="76" width="48" height="24" rx="4" fill="#8f5c94" fill-opacity="0.18" stroke="#8f5c94" stroke-width="2.5"/>
  <!-- capacity line -->
  <path d="M262 58 H346" stroke="#8f5c94" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <!-- link from board to gauge -->
  <path d="M240 100 C252 100, 256 100, 268 100" stroke="#b3ab9c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
</svg>
