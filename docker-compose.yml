# Self-hosted OpsCanopy.
#
#   docker compose up -d   ->   http://localhost:8080
#
# There is no database, no volume and no environment to configure, because there
# is no server-side state: every tool runs in the visitor's browser. Nothing this
# container receives is ever anything but a request for a static file.

services:
  opscanopy:
    # Pull the published multi-arch image instead of building locally by
    # swapping these two lines:
    #   image: ghcr.io/opscanopy/opscanopy.com:latest
    build: .
    image: opscanopy:latest
    container_name: opscanopy
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    # nginx writes its pid and its proxy/scratch caches; nothing else needs to
    # be writable, so the rest of the filesystem stays read-only.
    #
    # These are the long form, not the one-line `tmpfs:` list, because the mode
    # matters: a tmpfs mounts root-owned 0755 and MASKS the image's
    # `chown nginx:nginx`, so nginx (uid 101, per the Dockerfile's USER) could
    # not mkdir its temp dirs and the container crash-looped on
    # `mkdir() "/var/cache/nginx/client_temp" failed (13: Permission denied)`.
    # Compose's tmpfs options cannot express uid/gid — only mode — so this is
    # the portable fix. A world-writable tmpfs is not a meaningful exposure
    # here: it is empty at boot, lives only in this container's namespace, and
    # the container runs a single unprivileged process.
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    security_opt:
      - no-new-privileges:true
