# Self-hosted OpsCanopy.
#
#   docker compose up -d   ->   http://localhost:8080
#
# There is no database, no volume and no environment to configure, because there
# is no server-side state: every tool runs in the visitor's browser. Nothing this
# container receives is ever anything but a request for a static file.

services:
  opscanopy:
    build: .
    image: opscanopy:latest
    container_name: opscanopy
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      # nginx writes its pid and its proxy/scratch caches; nothing else needs to
      # be writable, so the rest of the filesystem stays read-only.
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
